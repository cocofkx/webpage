<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Extracellular-vesicle biomarker quality-control workflow</title><desc id="desc">Four stages: screen phosphorylated and total analytes; assess precision across signal levels; investigate batch and plate variability; evaluate controls. The workflow produces a quality-control profile for each analyte and assay form.</desc>
<rect width="1200" height="530" rx="22" fill="#f5f8fb"/>
<text x="48" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173e5b">Extracellular-vesicle biomarker QC</text>
<text x="48" y="96" font-family="Arial,sans-serif" font-size="17" fill="#53677b">From assay measurements to a documented QC profile</text>
<g font-family="Arial,sans-serif">
<rect x="45" y="135" width="255" height="220" rx="14" fill="#fff" stroke="#d3e2eb" stroke-width="2"/>
<rect x="330" y="135" width="255" height="220" rx="14" fill="#fff" stroke="#d3e2eb" stroke-width="2"/>
<rect x="615" y="135" width="255" height="220" rx="14" fill="#fff" stroke="#d3e2eb" stroke-width="2"/>
<rect x="900" y="135" width="255" height="220" rx="14" fill="#fff" stroke="#d3e2eb" stroke-width="2"/>
<g fill="#087b83" font-size="18" font-weight="700"><text x="66" y="175">01  SCREEN</text><text x="351" y="175">02  PRECISION</text><text x="636" y="175">03  VARIABILITY</text><text x="921" y="175">04  CONTROLS</text></g>
<g fill="#173e5b" font-size="21" font-weight="700"><text x="66" y="215">Screen analytes</text><text x="351" y="215">Assess signal</text><text x="351" y="241">and precision</text><text x="636" y="215">Investigate</text><text x="636" y="241">technical variation</text><text x="921" y="215">Evaluate assay</text><text x="921" y="241">controls</text></g>
<g fill="#53677b" font-size="16"><text x="66" y="274">Phosphorylated</text><text x="66" y="298">and total forms</text><text x="351" y="281">CV across signal</text><text x="351" y="305">levels and bands</text><text x="636" y="281">Batch, plate and</text><text x="636" y="305">specimen effects</text><text x="921" y="281">Distributions, batch</text><text x="921" y="305">patterns and ratios</text></g>
<g fill="#087b83" font-size="29" font-weight="700"><text x="303" y="254">›</text><text x="588" y="254">›</text><text x="873" y="254">›</text></g>
<rect x="45" y="395" width="1110" height="82" rx="14" fill="#e4f1f2"/><text x="600" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173e5b">QC profile for each analyte and assay form → downstream analysis</text>
</g></svg>

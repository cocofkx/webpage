project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - resume.qmd
    - research/index.qmd
    - research/missing-data.qmd
    - research/datafest-multiomics.qmd
    - research/barth-syndrome.qmd
    - research/influenza-neurodegeneration.qmd
    - research/ad-progression-thesis.qmd
    - research/biomarker-analytics.qmd
    - research/cervical-polypectomy.qmd
  resources:
    - assets/**
    - data/**

website:
  title: "Kexin Fu"
  site-url: "https://cocofkx.github.io/webpage/"
  description: "Research portfolio of Kexin Fu, a PhD researcher in biostatistics and health data science at George Washington University."
  favicon: assets/img/headshot-source.jpeg
  open-graph:
    locale: en_US
    site-name: "Kexin Fu"
    image: assets/img/social-preview.png
  twitter-card:
    image: assets/img/social-preview.png
    card-style: summary_large_image
  navbar:
    title: "Kexin Fu"
    pinned: true
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research/index.qmd
      - text: About
        href: about.qmd
      - text: Résumé
        href: resume.qmd
    right:
      - icon: envelope
        href: "mailto:kexin.fu@gwu.edu"
        aria-label: "Email Kexin Fu"
      - icon: linkedin
        href: "https://www.linkedin.com/in/kexin-fu-5a3354340"
        aria-label: "Kexin Fu on LinkedIn"
      - icon: github
        href: "https://github.com/cocofkx"
        aria-label: "Kexin Fu on GitHub"
  page-footer:
    left: "© 2026 Kexin Fu"
    center: "George Washington University · Washington, DC"
    right:
      - text: Email
        href: "mailto:kexin.fu@gwu.edu"
      - text: LinkedIn
        href: "https://www.linkedin.com/in/kexin-fu-5a3354340"
      - text: GitHub
        href: "https://github.com/cocofkx"
  search: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header: includes/head.html

execute:
  freeze: auto
